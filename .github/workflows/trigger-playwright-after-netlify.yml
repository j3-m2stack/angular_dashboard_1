name: Trigger Playwright After Netlify

on:
  status:

jobs:
  trigger:
    if: |
      github.event.state == 'success' &&
      github.event.context == 'netlify/angulardashborad/deploy-preview'
    runs-on: ubuntu-latest

    steps:
      - name: Print Status
        run: |
          echo "Status Context: ${{ github.event.context }}"
          echo "Status State: ${{ github.event.state }}"
          echo "Commit SHA: ${{ github.event.sha }}"

      - name: Find PR from Commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PLAYWRIGHT_PAT }}
        run: |
          curl \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.sha }}/pulls \
            -o prs.json

          echo "PR Response:"
          cat prs.json

          PR_NUMBER=$(jq -r '.[0].number' prs.json)

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No PR found."
            exit 1
          fi

          echo "PR Number: $PR_NUMBER"

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

      - name: Trigger Playwright Repository
        env:
          GH_TOKEN: ${{ secrets.PLAYWRIGHT_PAT }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/j3-m2stack/playwright_test/dispatches \
            -d "{
              \"event_type\":\"run-playwright\",
              \"client_payload\":{
                \"pr_number\":\"${PR_NUMBER}\"
              }
            }"

          echo "Playwright triggered successfully."