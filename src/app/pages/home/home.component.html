<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Dashboard Overview</h1>
    <p>Welcome back! Here's what's happening today.</p>
  </div>

  <!-- Top Statistics -->
  <div class="stats-grid">
    <app-stat-card *ngFor="let stat of stats"
      [title]="stat.title"
      [value]="stat.value"
      [icon]="stat.icon"
      [color]="stat.color"
      [trend]="stat.trend"
      [trendUp]="stat.trendUp">
    </app-stat-card>
  </div>

  <!-- Charts Row -->
  <div class="charts-grid">
    <app-chart-card class="chart-main"
      title="Revenue Overview"
      subtitle="Monthly revenue tracking"
      chartType="line"
      [chartData]="lineChartData">
    </app-chart-card>
    
    <div class="charts-side">
      <app-chart-card
        title="Weekly Orders"
        chartType="bar"
        [chartData]="barChartData">
      </app-chart-card>
      <app-chart-card
        title="Traffic Source"
        chartType="doughnut"
        [chartData]="pieChartData">
      </app-chart-card>
    </div>
  </div>

  <!-- Bottom Widgets -->
  <div class="widgets-grid">
    <div class="widget-col">
      <app-recent-users-table [data]="recentUsers"></app-recent-users-table>
    </div>
    <div class="widget-col">
      <app-recent-activity [activities]="activities"></app-recent-activity>
    </div>
    <div class="widget-col">
      <app-notification-panel [notifications]="notifications"></app-notification-panel>
    </div>
    <div class="widget-col">
      <app-quick-actions [actions]="quickActions"></app-quick-actions>
    </div>
  </div>
</div>
